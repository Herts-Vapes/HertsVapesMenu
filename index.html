<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="Herts Vapes live menu. Tap, build and send your order." />
  <title>Herts Vapes Menu</title>
  <link rel="stylesheet" href="style.css?v=hv-logo-final-20260918" />
</head>
<body>
  <main class="site-shell" data-version="hv-menu-v2-3-20260727">
    <section class="hero" id="top">
      <div class="hero-focus">
        <div class="hero-identity" aria-label="Herts Vapes">
          <img class="hero-logo-image" src="hv-logo.png" alt="Herts Vapes" width="1774" height="887" />
        </div>

        <div class="hero-rule" aria-hidden="true"></div>

        <div class="hero-connect-intro">
          <strong>Add Herts Vapes</strong>
          <span>Stock • Deals • Updates</span>
        </div>

        <div class="hero-contact-actions" aria-label="Add or message Herts Vapes">
          <a class="hero-contact-button snapchat" data-snapchat-link href="#">
            <span class="hero-action-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32"><path d="M16 4.3c-4.2 0-6.8 3.2-6.8 7.5v3.5c0 .7-.2 1.2-.7 1.8-.8.9-1.7 1.5-2.9 2-.6.2-.8.9-.4 1.4.7.9 1.7 1.4 3 1.5.2 1.2.9 2 2.1 2.3.8.2 1.3.5 1.8 1.1.8 1 1.9 1.5 3.3 1.5h3.2c1.4 0 2.5-.5 3.3-1.5.5-.6 1-.9 1.8-1.1 1.2-.3 1.9-1.1 2.1-2.3 1.3-.1 2.3-.6 3-1.5.4-.5.2-1.2-.4-1.4-1.2-.5-2.1-1.1-2.9-2-.5-.6-.7-1.1-.7-1.8v-3.5c0-4.3-2.6-7.5-6.8-7.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
            </span>
            <span class="hero-action-copy">
              <span class="hero-contact-main">Add on Snapchat</span>
              <span class="hero-contact-sub">Tap to add account</span>
            </span>
            <svg class="hero-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>

          <a class="hero-contact-button whatsapp" data-whatsapp-link href="#">
            <span class="hero-action-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32"><path d="M16 5.1A10.9 10.9 0 0 0 6.7 21.7l-1.4 5.1 5.2-1.4A10.9 10.9 0 1 0 16 5.1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M12.1 10.7c.3-.6.6-.7 1.1-.7h.6c.3 0 .5.1.7.6l1.1 2.7c.1.3.1.6-.1.9l-.8 1c-.2.2-.2.5 0 .7 1 1.8 2.5 3.1 4.4 4 .3.1.5.1.7-.1l1.2-1.4c.2-.3.5-.4.8-.2l2.5 1.2c.4.2.6.4.6.7 0 .4-.2 1.7-1 2.4-.8.8-2 1.3-3.4 1-1.6-.3-3.7-1-6-3-2.7-2.4-4.3-5.3-4.7-7-.4-1.4 0-2.2.3-2.8z" fill="currentColor"/></svg>
            </span>
            <span class="hero-action-copy">
              <span class="hero-contact-main">Message on WhatsApp</span>
              <span class="hero-contact-sub">Tap to open chat</span>
            </span>
            <svg class="hero-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>

        <button class="hero-cta" type="button" data-scroll="#menu">
          <span class="hero-action-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M5.2 7.5h3.2l2.2 12.1h13.8l2.2-8.4H10.1M13 24.8a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6zm10 0a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="hero-menu-copy">
            <strong>Browse Live Menu</strong>
            <small>Tap to view menu</small>
          </span>
          <svg class="hero-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <section class="shop" id="menu" aria-label="Build your order">
      <header class="shop-header">
        <span class="shop-header-watermark" aria-hidden="true">HV</span>
        <div class="shop-live-label"><span class="live-dot" aria-hidden="true"></span> LIVE MENU</div>
        <h1><span>Build Your</span><strong>Order</strong></h1>
        <div class="shop-header-rule" aria-hidden="true"><span></span><b>HV</b><span></span></div>
        <p class="shop-instruction">Tap a product, choose your flavour and add it.</p>
        <p class="shop-stock-note"><span class="live-dot" aria-hidden="true"></span> Live stock • Updated regularly</p>
      </header>

      <div class="category-list" id="categoryList"></div>

      <div class="more-area">
        <button class="more-toggle" id="moreToggle" type="button" aria-expanded="false">Bulk Orders</button>
        <div class="more-content" id="moreContent" hidden></div>
      </div>
    </section>

    <button class="order-bar" id="orderBar" type="button" hidden aria-label="Review and send your order">
      <span class="order-bar-main">
        <strong id="orderBarCount">1 item</strong>
        <small id="orderBarTotal">£0.00</small>
      </span>
      <span class="order-bar-action">Send Order →</span>
    </button>

    <div class="cart-overlay" id="cartOverlay" aria-hidden="true"></div>
    <section class="cart-drawer" id="cartDrawer" aria-label="Your order" aria-hidden="true">
      <div class="cart-handle" aria-hidden="true"></div>
      <header class="cart-header">
        <div>
          <p>YOUR ORDER</p>
          <h2>Check and send</h2>
        </div>
        <button class="cart-close" id="cartClose" type="button" aria-label="Close order">×</button>
      </header>
      <div class="cart-body" id="cartBody"></div>
      <footer class="cart-footer">
        <div class="cart-total"><span>Total</span><strong id="cartTotal">£0.00</strong></div>
        <button class="send-button whatsapp" id="cartWhatsapp" type="button">Send on WhatsApp</button>
        <button class="send-button snapchat" id="cartSnapchat" type="button">Copy &amp; Open Snapchat</button>
        <button class="cart-clear" id="cartClear" type="button">Clear order</button>
      </footer>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite">✓ Added</div>
  </main>

  <script src="settings.js?v=hv-contact-20260812"></script>
  <script src="inventory.js?v=hv-stock-20260922-fixed-v2"></script>
  <script src="script.js?v=hv-menu-improve-20260913"></script>
</body>
</html>
